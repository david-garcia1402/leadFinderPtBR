<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conta e plano — Lead Finder</title><meta name="description" content="Acompanhe sua conta, a franquia do plano e o checkout do Lead Finder."><link rel="icon" href="/logo.svg"><link rel="stylesheet" href="/landing.css"><meta name="robots" content="noindex, nofollow"></head>
<body class="auth-page">
<a class="skip" href="#main">Pular para o conteúdo</a>
<header class="top"><a class="brand" href="/" aria-label="Lead Finder início"><img src="/logo.svg" width="40" height="40" alt=""><span>lead<span class="peach">finder</span><small>by cub4Studio</small></span></a><nav aria-label="Navegação da conta"><a href="/app">Painel</a><a href="/entrar">Entrar</a></nav></header>
<main id="main" class="wrap auth-shell">
  <p class="eyebrow"><i></i> CONTA E PLANO</p>
  <h1>Sua franquia fica<br><em>ligada à sua conta.</em></h1>
  <p class="auth-lead" id="account-lead">Entre para ver o status da assinatura. O checkout só inicia quando o provedor de pagamento estiver configurado.</p>
  <section class="auth-card" id="session-card">
    <p class="mini-label">SESSÃO</p>
    <p id="session-line">Verificando sua sessão…</p>
    <div class="auth-actions">
      <a class="button small outline" href="/entrar">Entrar ou criar conta</a>
      <button class="button small outline" id="logout" type="button" hidden>Sair</button>
      <a class="text-link" href="/app">Abrir painel →</a>
    </div>
  </section>
  <section class="plans account-plans" id="plans"></section>
  <p id="checkout-status" role="status"></p>
</main>
<script src="/account.js" type="module"></script>
</body></html>
